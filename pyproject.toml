[project]
name = "stageground"
version = "0.0.0"
description = "Evidence-grounded, schema-guided LLM extraction of TNM staging from pathology reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",      # parquet engine
    "pydantic>=2.7",
    "scikit-learn>=1.5",  # metrics (Track A)
    "openai>=1.30",       # LLM client (swap/extend per provider)
    "python-dotenv>=1.0", # load API keys from .env
]

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
analysis = ["matplotlib>=3.8"]  # research figures (stageground.evaluation.plots)
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]
arm-e = ["torch>=2.3", "transformers>=4.40"]  # Arm E: Tatonetti/Kefeli supervised reference (HF inference only, no training)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stageground"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
